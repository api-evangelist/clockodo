tags:
- name: EntryGroup
  description: Query and manage groups of time entries (particularly useful for evaluation and invoicing purposes)
paths:
  /v2/entrygroups:
    get:
      tags:
      - EntryGroup
      operationId: getEntryGroupsV2
      parameters:
      - name: calc_also_revenues_for_projects_with_hard_budget
        in: query
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: filter
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          properties:
            billable:
              oneOf:
              - $ref: '#/components/schemas/BillableDistinct'
              - type: 'null'
            budget_type:
              oneOf:
              - $ref: '#/components/schemas/BudgetOption'
              - type: 'null'
            customers_id:
              type:
              - integer
              - 'null'
              minimum: 1
            lumpsum_services_id:
              type:
              - integer
              - 'null'
              minimum: 1
            projects_id:
              type:
              - integer
              - 'null'
              minimum: 1
            services_id:
              type:
              - integer
              - 'null'
              minimum: 1
            subprojects_id:
              type:
              - integer
              - 'null'
              minimum: 1
            teams_id:
              type:
              - integer
              - 'null'
              minimum: 1
            text:
              type:
              - string
              - 'null'
            texts_id:
              type:
              - integer
              - 'null'
              minimum: 1
            users_id:
              type:
              - integer
              - 'null'
              minimum: 1
          type:
          - object
          - 'null'
      - name: grouping
        in: query
        required: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Grouping'
          minItems: 1
      - name: prepend_customer_to_project_name
        in: query
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: round_per_entry
        in: query
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: round_to_minutes
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
      - name: time_since
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2023-02-28T12:00:00Z'
      - name: time_until
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2023-02-28T12:00:00Z'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - groups
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntryGroupV2'
                type: object
      deprecated: false
      summary: Get entry groups V2
      x-summary-source: derived
    put:
      tags:
      - EntryGroup
      operationId: updateEntryGroupsV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - time_since
              - time_until
              properties:
                time_since:
                  type: string
                  format: date-time
                  examples:
                  - '2023-02-28T12:00:00Z'
                time_until:
                  type: string
                  format: date-time
                  examples:
                  - '2023-02-28T12:00:00Z'
                users_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                customers_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                projects_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                subprojects_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                services_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                lumpsum_services_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                billable:
                  oneOf:
                  - $ref: '#/components/schemas/BillableDistinct'
                  - type: 'null'
                text:
                  type:
                  - string
                  - 'null'
                hourly_rate:
                  type:
                  - number
                  - 'null'
                  format: float
                  minimum: 0
                confirm_key:
                  description: For safety, the api will respond with a confirmation key with which you have to request once again in order to confirm your edit action
                  type: string
                filter:
                  properties:
                    billable:
                      oneOf:
                      - $ref: '#/components/schemas/BillableDistinct'
                      - type: 'null'
                    budget_type:
                      oneOf:
                      - $ref: '#/components/schemas/BudgetOption'
                      - type: 'null'
                    customers_id:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                    lumpsum_services_id:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                    projects_id:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                    services_id:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                    subprojects_id:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                    teams_id:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                    text:
                      type:
                      - string
                      - 'null'
                    texts_id:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                    users_id:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                  type:
                  - object
                  - 'null'
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EntryGroupUpdateV2'
                - $ref: '#/components/schemas/EntryGroupConfirmUpdateV2'
      deprecated: false
      summary: Update entry groups V2
      x-summary-source: derived
    delete:
      tags:
      - EntryGroup
      operationId: deleteEntryGroupsV2
      parameters:
      - name: confirm_key
        in: query
        required: false
        schema:
          type: string
      - name: filter
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          properties:
            billable:
              oneOf:
              - $ref: '#/components/schemas/BillableDistinct'
              - type: 'null'
            budget_type:
              oneOf:
              - $ref: '#/components/schemas/BudgetOption'
              - type: 'null'
            customers_id:
              type:
              - integer
              - 'null'
              minimum: 1
            lumpsum_services_id:
              type:
              - integer
              - 'null'
              minimum: 1
            projects_id:
              type:
              - integer
              - 'null'
              minimum: 1
            services_id:
              type:
              - integer
              - 'null'
              minimum: 1
            subprojects_id:
              type:
              - integer
              - 'null'
              minimum: 1
            teams_id:
              type:
              - integer
              - 'null'
              minimum: 1
            text:
              type:
              - string
              - 'null'
            texts_id:
              type:
              - integer
              - 'null'
              minimum: 1
            users_id:
              type:
              - integer
              - 'null'
              minimum: 1
          type:
          - object
          - 'null'
      - name: time_since
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2023-02-28T12:00:00Z'
      - name: time_until
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2023-02-28T12:00:00Z'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EntryGroupUpdateV2'
                - $ref: '#/components/schemas/EntryGroupConfirmUpdateV2'
      deprecated: false
      summary: Delete entry groups V2
      x-summary-source: derived
components:
  schemas:
    EntryGroupV2:
      required:
      - group
      - name
      - duration
      - restrictions
      - grouped_by
      properties:
        group:
          description: Identifier of the current group
          oneOf:
          - type: string
          - type: integer
            format: int64
        name:
          description: Textual description of the current group
          type: string
        duration:
          description: Duration of all time entries of the group
          type: integer
          format: int64
        restrictions:
          description: Restrictions that apply to the current group, except for the current grouped_by and time restrictions
          oneOf:
          - $ref: '#/components/schemas/EntryGroupNoRestrictionV2'
          - $ref: '#/components/schemas/EntryGroupRestrictionV2'
          - type: 'null'
        revenue:
          description: Revenue of all time entries in the group (only if necessary employee rights for the group)
          type: number
          format: float
        has_budget_revenues_billed:
          description: Does the group have at least one time entry that uses the hard project budget and has already been billed? (only if necessary employee rights for the group)
          type: boolean
        has_budget_revenues_not_billed:
          description: Does the group have at least one time entry that uses a hard project budget and has not yet been billed? (Only if necessary employee rights for the group)
          type: boolean
        has_non_budget_revenues_billed:
          description: Does the group have at least one time entry that does not use a hard project budget and has already been billed? (Only if the necessary employee rights are assigned to the group)
          type: boolean
        has_non_budget_revenues_not_billed:
          description: Does the group have at least one time entry that does not use a hard project budget and has not yet been billed? (Only if necessary employee rights for the group)
          type: boolean
        budget_used:
          description: Was a fixed project budget used for at least one time entry? (Only if necessary employee rights for the group)
          type: boolean
        hourly_rate:
          description: Average hourly rate for the group (only if necessary employee rights for the group)
          type:
          - number
          - 'null'
          format: float
        hourly_rate_is_equal_and_has_no_lumpsums:
          description: 'Is the hourly rate the same for all billable entries and does the group have no flat-rate entries? In this case, revenue can be calculated as follows: revenue = hourly_rate * duration. This is particularly useful for creating invoice items. (Only if the necessary employee rights for the group are available)'
          type: boolean
        sub_groups:
          description: If multiple grouping criteria have been specified, the next level can be found here.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EntryGroupV2'
        grouped_by:
          description: Grouping criterion of the current grouping level
          type: string
      type: object
    BudgetOption:
      title: Budget option
      description: 'Possible values:

        - `rep_filter_budget_strict`: Strict

        - `rep_filter_budget_strict_completed`: StrictCompleted

        - `rep_filter_budget_strict_incomplete`: StrictIncomplete

        - `rep_filter_budget_soft`: Soft

        - `rep_filter_budget_soft_completed`: SoftCompleted

        - `rep_filter_budget_soft_incomplete`: SoftIncomplete

        - `rep_filter_budget_without`: Without

        - `rep_filter_budget_without_strict`: WithoutStrict'
      type: string
      enum:
      - rep_filter_budget_strict
      - rep_filter_budget_strict_completed
      - rep_filter_budget_strict_incomplete
      - rep_filter_budget_soft
      - rep_filter_budget_soft_completed
      - rep_filter_budget_soft_incomplete
      - rep_filter_budget_without
      - rep_filter_budget_without_strict
      x-enumNames:
      - Strict
      - StrictCompleted
      - StrictIncomplete
      - Soft
      - SoftCompleted
      - SoftIncomplete
      - Without
      - WithoutStrict
    EntryGroupUpdateV2:
      required:
      - success
      - edited_entries
      properties:
        success:
          type: boolean
        edited_entries:
          type: integer
          format: int64
      type: object
    BillableDistinct:
      title: Billable distinct
      description: 'Possible values:

        - `0`: NotBillable

        - `1`: Billable

        - `2`: Billed'
      type: integer
      enum:
      - 0
      - 1
      - 2
      x-enumNames:
      - NotBillable
      - Billable
      - Billed
    Billable:
      title: Billable
      description: 'Possible values:

        - `0`: NotBillable

        - `1`: Billable

        - `2`: Billed

        - `12`: BillableOrBilled'
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 12
      x-enumNames:
      - NotBillable
      - Billable
      - Billed
      - BillableOrBilled
    EntryGroupRestrictionV2:
      properties:
        users_id:
          type:
          - integer
          - 'null'
          format: int64
        teams_id:
          type:
          - integer
          - 'null'
          format: int64
        customers_id:
          type:
          - integer
          - 'null'
          format: int64
        projects_id:
          type:
          - integer
          - 'null'
          format: int64
        subprojects_id:
          type:
          - integer
          - 'null'
          format: int64
        services_id:
          type:
          - integer
          - 'null'
          format: int64
        lumpsum_services_id:
          type:
          - integer
          - 'null'
          format: int64
        billable:
          oneOf:
          - $ref: '#/components/schemas/Billable'
          - type: 'null'
        entriesTexts_id:
          type:
          - integer
          - 'null'
          format: int64
        budget_type:
          type:
          - string
          - 'null'
      type: object
    EntryGroupConfirmUpdateV2:
      required:
      - confirm_key
      - affected_entries
      properties:
        confirm_key:
          type: string
        affected_entries:
          type: integer
          format: int64
      type: object
    EntryGroupNoRestrictionV2:
      properties: {}
    Grouping:
      title: Grouping
      description: 'Possible values:

        - `billable`: Billable

        - `customers_id`: CustomersId

        - `day`: Day

        - `month`: Month

        - `is_lumpsum`: IsLumpSum

        - `lumpsum_services_id`: LumpSumServicesId

        - `projects_id`: ProjectsId

        - `services_id`: ServicesId

        - `subprojects_id`: SubprojectsId

        - `texts_id`: TextsId

        - `users_id`: UsersId

        - `week`: Week

        - `year`: Year'
      type: string
      enum:
      - billable
      - customers_id
      - day
      - month
      - is_lumpsum
      - lumpsum_services_id
      - projects_id
      - services_id
      - subprojects_id
      - texts_id
      - users_id
      - week
      - year
      x-enumNames:
      - Billable
      - CustomersId
      - Day
      - Month
      - IsLumpSum
      - LumpSumServicesId
      - ProjectsId
      - ServicesId
      - SubprojectsId
      - TextsId
      - UsersId
      - Week
      - Year
  securitySchemes:
    BasicAuth:
      type: http
      description: The basic authentication of the HTTP protocol. Credentials are email address and API key.<br />Every co-worker will find his API key in the menu item "Personal data" in his Clockodo account.
      scheme: basic
    User:
      type: apiKey
      description: 'Must be filled together with <code>X-ClockodoApiKey</code><br /><strong>Example: admin@clockodo.com</strong>'
      name: X-ClockodoApiUser
      in: header
    Key:
      type: apiKey
      description: Must be filled together with <code>X-ClockodoApiUser</code>
      name: X-ClockodoApiKey
      in: header
    ExternalApp:
      type: apiKey
      description: 'Every request to our API must provide identification of the calling application, including the email address of a technical contact person.<br /><strong>Example: "Clockodo;admin@clockodo.com"</strong>'
      name: X-Clockodo-External-Application
      in: header
    OAuth2:
      type: oauth2
      description: OAuth 2.0 for external integrations via authorization code flow with refresh tokens. OAuth clients can be provisioned via Dynamic Client Registration (POST /oauth/register) or Client ID Metadata Documents (CIMD). Dynamically registered clients are deleted after 90 days without any token or authorization code activity; store the issued client_id and client_secret permanently, as the secret is only returned once.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /token
          refreshUrl: /token
          scopes:
            full_access: Full access to all API endpoints
            accessGroups:read: Read access group data
            accessGroups:write: Write access group data
            absences:read: Read absence data
            absences:write: Write absence data
            browserExtensionRules:read: Read browser extension rule data
            browserExtensionRules:write: Write browser extension rule data
            clock:read: Read clock data
            clock:write: Write clock data
            company:read: Read company data
            customers:read: Read customer data
            customers:write: Write customer data
            entryGroups:read: Read entry group data
            entryGroups:write: Write entry group data
            entries:read: Read time entry data
            entries:write: Write time entry data
            entriesTexts:read: Read time entry text data
            entriesTexts:write: Write time entry text data
            holidaysCarry:read: Read holiday carryover data
            holidaysCarry:write: Write holiday carryover data
            holidaysQuota:read: Read holiday quota data
            holidaysQuota:write: Write holiday quota data
            lumpSumServices:read: Read lump sum service data
            lumpSumServices:write: Write lump sum service data
            nonbusinessDays:read: Read nonbusiness day data
            nonbusinessDays:write: Write nonbusiness day data
            nonbusinessGroups:read: Read nonbusiness group data
            nonbusinessGroups:write: Write nonbusiness group data
            overtimeCarry:read: Read overtime carryover data
            overtimeCarry:write: Write overtime carryover data
            overtimeReductions:read: Read overtime reduction data
            overtimeReductions:write: Write overtime reduction data
            projects:read: Read project data
            projects:write: Write project data
            rates:read: Read rate data
            rates:write: Write rate data
            services:read: Read service data
            services:write: Write service data
            subprojects:read: Read subproject data
            subprojects:write: Write subproject data
            subscription:read: Read subscription data
            targetHours:read: Read planned hours data
            targetHours:write: Write planned hours data
            teams:read: Read team data
