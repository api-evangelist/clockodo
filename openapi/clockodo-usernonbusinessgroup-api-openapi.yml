tags:
- name: UserNonbusinessGroup
  description: Assign non-business day groups to users and manage time periods
paths:
  /v3/usersNonbusinessGroups:
    get:
      tags:
      - UserNonbusinessGroup
      operationId: getUsersNonbusinessGroupsV3
      parameters:
      - name: filter
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          properties:
            nonbusiness_groups_id:
              oneOf:
              - type: array
                items:
                  type: integer
                  minimum: 1
                maxItems: 500
              - type: integer
                minimum: 1
              - type: string
                format: csv-string
                x-csv-element-schema:
                  type: integer
                  minimum: 1
            users_id:
              oneOf:
              - type: array
                items:
                  type: integer
                  minimum: 1
                maxItems: 500
              - type: integer
                minimum: 1
              - type: string
                format: csv-string
                x-csv-element-schema:
                  type: integer
                  minimum: 1
          type: object
      - name: items_per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          maximum: 1000
          minimum: 1
          examples:
          - 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - paging
                - data
                properties:
                  paging:
                    required:
                    - items_per_page
                    - current_page
                    - count_pages
                    - count_items
                    properties:
                      items_per_page:
                        type: integer
                        format: int64
                        examples:
                        - 1000
                      current_page:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_pages:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_items:
                        type: integer
                        format: int64
                        examples:
                        - 4
                    type: object
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsersNonbusinessGroupV3'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get users nonbusiness groups V3
      x-summary-source: derived
    post:
      tags:
      - UserNonbusinessGroup
      operationId: createUsersNonbusinessGroupV3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - users_id
              - nonbusiness_groups_id
              - date_since
              properties:
                users_id:
                  type: integer
                nonbusiness_groups_id:
                  type: integer
                date_since:
                  type: string
                  format: date
                  examples:
                  - '2023-02-28'
                date_until:
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UsersNonbusinessGroupV3'
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiUsersNonbusinessGroupsV3Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create users nonbusiness group V3
      x-summary-source: derived
  /v3/usersNonbusinessGroups/{id}:
    get:
      tags:
      - UserNonbusinessGroup
      operationId: getUsersNonbusinessGroupByIdV3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UsersNonbusinessGroupV3'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get users nonbusiness group by id V3
      x-summary-source: derived
    put:
      tags:
      - UserNonbusinessGroup
      operationId: updateUsersNonbusinessGroupByIdV3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                nonbusiness_groups_id:
                  type: integer
                date_since:
                  type: string
                  format: date
                  examples:
                  - '2023-02-28'
                date_until:
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UsersNonbusinessGroupV3'
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiUsersNonbusinessGroupsV3Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Update users nonbusiness group by id V3
      x-summary-source: derived
    delete:
      tags:
      - UserNonbusinessGroup
      operationId: deleteUsersNonbusinessGroupByIdV3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - success
                properties:
                  success:
                    title: Success
                    type: boolean
                    examples:
                    - true
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiUsersNonbusinessGroupsV3Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Delete users nonbusiness group by id V3
      x-summary-source: derived
components:
  schemas:
    ResourceNotFoundError:
      title: Resource not found error
      properties:
        type:
          type: string
          enum:
          - ResourceNotFound
        message:
          type:
          - string
          - 'null'
          examples:
          - The requested resource could not be found.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: BadRequest
    EndBeforeStartError:
      title: End before start error
      properties:
        type:
          type: string
          enum:
          - EndBeforeStart
        message:
          type:
          - string
          - 'null'
          examples:
          - An error occurred, please try again.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: BadRequest
    ApiErrors:
      properties:
        type:
          description: Unique identifier of the error
          type: string
          examples:
          - General
        message:
          description: Textual error description
          type: string
          examples:
          - The requested resource could not be found.
        details:
          description: Additional error details if necessary
          type:
          - object
          - 'null'
          examples:
          - null
        path:
          type:
          - string
          - 'null'
      type: object
    UsersNonbusinessGroupsCollisionError:
      title: Users nonbusiness groups collision error
      properties:
        type:
          type: string
          enum:
          - UsersNonbusinessGroupsCollision
        message:
          type:
          - string
          - 'null'
          examples:
          - An error occurred, please try again.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: BadRequest
    ApiUsersNonbusinessGroupsV3Errors:
      title: Api users nonbusiness groups v3 errors
      required:
      - error
      properties:
        error:
          title: Errors
          type: object
          anyOf:
          - $ref: '#/components/schemas/ResourceNotFoundError'
          - $ref: '#/components/schemas/UsersNonbusinessGroupsCollisionError'
          - $ref: '#/components/schemas/EndBeforeStartError'
      type: object
    GeneralErrors:
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrors'
      type: object
    UsersNonbusinessGroupV3:
      required:
      - id
      - date_since
      - date_until
      - nonbusiness_groups_id
      - users_id
      properties:
        id:
          type: integer
          format: int64
          examples:
          - 10
        date_since:
          type: string
          format: date
          examples:
          - '2025-01-31'
        date_until:
          type:
          - string
          - 'null'
          format: date
          examples:
          - '2025-01-31'
        nonbusiness_groups_id:
          type:
          - integer
          - 'null'
          format: int64
          examples:
          - 10
        users_id:
          type: integer
          format: int64
          examples:
          - 10
      type: object
  securitySchemes:
    BasicAuth:
      type: http
      description: The basic authentication of the HTTP protocol. Credentials are email address and API key.<br />Every co-worker will find his API key in the menu item "Personal data" in his Clockodo account.
      scheme: basic
    User:
      type: apiKey
      description: 'Must be filled together with <code>X-ClockodoApiKey</code><br /><strong>Example: admin@clockodo.com</strong>'
      name: X-ClockodoApiUser
      in: header
    Key:
      type: apiKey
      description: Must be filled together with <code>X-ClockodoApiUser</code>
      name: X-ClockodoApiKey
      in: header
    ExternalApp:
      type: apiKey
      description: 'Every request to our API must provide identification of the calling application, including the email address of a technical contact person.<br /><strong>Example: "Clockodo;admin@clockodo.com"</strong>'
      name: X-Clockodo-External-Application
      in: header
    OAuth2:
      type: oauth2
      description: OAuth 2.0 for external integrations via authorization code flow with refresh tokens. OAuth clients can be provisioned via Dynamic Client Registration (POST /oauth/register) or Client ID Metadata Documents (CIMD). Dynamically registered clients are deleted after 90 days without any token or authorization code activity; store the issued client_id and client_secret permanently, as the secret is only returned once.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /token
          refreshUrl: /token
          scopes:
            full_access: Full access to all API endpoints
            accessGroups:read: Read access group data
            accessGroups:write: Write access group data
            absences:read: Read absence data
            absences:write: Write absence data
            browserExtensionRules:read: Read browser extension rule data
            browserExtensionRules:write: Write browser extension rule data
            clock:read: Read clock data
            clock:write: Write clock data
            company:read: Read company data
            customers:read: Read customer data
            customers:write: Write customer data
            entryGroups:read: Read entry group data
            entryGroups:write: Write entry group data
            entries:read: Read time entry data
            entries:write: Write time entry data
            entriesTexts:read: Read time entry text data
            entriesTexts:write: Write time entry text data
            holidaysCarry:read: Read holiday carryover data
            holidaysCarry:write: Write holiday carryover data
            holidaysQuota:read: Read holiday quota data
            holidaysQuota:write: Write holiday quota data
            lumpSumServices:read: Read lump sum service data
            lumpSumServices:write: Write lump sum service data
            nonbusinessDays:read: Read nonbusiness day data
            nonbusinessDays:write: Write nonbusiness day data
            nonbusinessGroups:read: Read nonbusiness group data
            nonbusinessGroups:write: Write nonbusiness group data
            overtimeCarry:read: Read overtime carryover data
            overtimeCarry:write: Write overtime carryover data
            overtimeReductions:read: Read overtime reduction data
            overtimeReductions:write: Write overtime reduction data
            projects:read: Read project data
            projects:write: Write project data
            rates:read: Read rate data
            rates:write: Write rate data
            services:read: Read service data
            services:write: Write service data
            subprojects:read: Read subproject data
            subprojects:write: Write subproject data
            subscription:read: Read subscription data
            targetHours:read: Read planned hours data
            targetHours:write: Write planned hours data
            teams:read: Read team data
            teams:write: Write team data
            userReports:read: Read co-worker report data
            users:read: Read co-worker data
            users:write: Write co-worker data
            usersNonbusinessDays:read: Read co-worker nonbusiness day data
            usersNonbusinessGroups:read: Read co-worker nonbusiness group data
            usersNonbusinessGroups:write: Write co-worker nonbusiness group data
            workTimes:read: Read work time data
            workTimes:write: Write work time data
