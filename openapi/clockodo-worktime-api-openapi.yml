tags:
- name: WorkTime
  description: Manage work times. Work times cannot be edited directly. To edit work times, edit the respective time entries or use requests for change of work time.
paths:
  /v2/workTimes:
    get:
      tags:
      - WorkTime
      operationId: getWorkTimesV2
      parameters:
      - name: date_since
        in: query
        required: true
        schema:
          type: string
          format: date
          examples:
          - '2023-02-28'
      - name: date_until
        in: query
        required: true
        schema:
          type: string
          format: date
          examples:
          - '2023-02-28'
      - name: users_id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - paging
                - work_time_days
                properties:
                  paging:
                    required:
                    - items_per_page
                    - current_page
                    - count_pages
                    - count_items
                    properties:
                      items_per_page:
                        type: integer
                        format: int64
                        examples:
                        - 1000
                      current_page:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_pages:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_items:
                        type: integer
                        format: int64
                        examples:
                        - 4
                    type: object
                  work_time_days:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkTimeV2'
                type: object
      deprecated: false
      summary: Get work times V2
      x-summary-source: derived
  /v2/workTimes/changeRequests:
    get:
      tags:
      - WorkTime
      operationId: getWorkTimesChangeRequestsV2
      parameters:
      - name: date_since
        in: query
        required: false
        schema:
          type: string
          format: date
          examples:
          - '2023-02-28'
      - name: date_until
        in: query
        required: false
        schema:
          type: string
          format: date
          examples:
          - '2023-02-28'
      - name: items_per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          maximum: 1000
          minimum: 1
          examples:
          - 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          examples:
          - 1
      - name: scope
        in: query
        description: Filter by scope, to get change requests that are pending approval or declined.
        required: false
        schema:
          $ref: '#/components/schemas/ChangeRequestScope'
      - name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SortIdDate'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ChangeRequestStatus'
      - name: teams_id
        in: query
        required: false
        schema:
          oneOf:
          - type: array
            items:
              type:
              - integer
              - 'null'
              minimum: 0
            maxItems: 500
          - type:
            - integer
            - 'null'
            minimum: 0
          - type: string
            format: csv-string
            x-csv-element-schema:
              type:
              - integer
              - 'null'
              minimum: 0
      - name: users_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - paging
                - change_requests
                properties:
                  paging:
                    required:
                    - items_per_page
                    - current_page
                    - count_pages
                    - count_items
                    properties:
                      items_per_page:
                        type: integer
                        format: int64
                        examples:
                        - 1000
                      current_page:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_pages:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_items:
                        type: integer
                        format: int64
                        examples:
                        - 4
                    type: object
                  change_requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkTimesChangeRequestV2'
                type: object
      deprecated: false
      summary: Get work times change requests V2
      x-summary-source: derived
    post:
      tags:
      - WorkTime
      operationId: createWorkTimesChangeRequestV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - date
              - users_id
              - changes
              properties:
                date:
                  type: string
                  format: date
                  examples:
                  - '2023-02-28'
                users_id:
                  type: integer
                  minimum: 1
                changes:
                  type: array
                  items:
                    required:
                    - type
                    - time_until
                    - time_since
                    properties:
                      time_since:
                        type: string
                        format: date-time
                        examples:
                        - '2023-02-28T12:00:00Z'
                      time_until:
                        type: string
                        format: date-time
                        examples:
                        - '2023-02-28T12:00:00Z'
                      type:
                        $ref: '#/components/schemas/ChangeRequestIntervalType'
                    type: object
                  minItems: 1
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkTimesChangeRequestPostV2'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create work times change request V2
      x-summary-source: derived
  /v2/workTimes/changeRequests/{id}:
    delete:
      tags:
      - WorkTime
      operationId: deleteWorkTimesChangeRequestByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkTimesChangeRequestDeleteV2'
      deprecated: false
      summary: Delete work times change request by id V2
      x-summary-source: derived
  /v2/workTimes/changeRequests/{id}/decline:
    post:
      tags:
      - WorkTime
      operationId: declineWorkTimesChangeRequestByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkTimesChangeRequestsDeclineV2'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '400':
          description: An error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponses'
      deprecated: true
      summary: Decline work times change request by id V2
      x-summary-source: derived
  /v3/workTimes/changeRequests/{id}/approve:
    post:
      tags:
      - WorkTime
      operationId: approveWorkTimesChangeRequestByIdV3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                approve_violations:
                  type: boolean
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - success
                properties:
                  success:
                    title: Success
                    type: boolean
                    examples:
                    - true
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '400':
          description: An error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponses'
      deprecated: false
      summary: Approve work times change request by id V3
      x-summary-source: derived
components:
  schemas:
    WorkTimesChangeRequestsDeclineChangeV2:
      required:
      - type
      - time_since
      - time_until
      properties:
        type:
          $ref: '#/components/schemas/ChangeRequestIntervalType'
        time_since:
          type: string
        time_until:
          type:
          - string
          - 'null'
      type: object
    ChangeRequestIntervalType:
      title: Change request interval type
      description: 'Possible values:

        - `1`: Added

        - `2`: Removed'
      type: integer
      enum:
      - 1
      - 2
      x-enumNames:
      - Added
      - Removed
    ApiErrors:
      properties:
        type:
          description: Unique identifier of the error
          type: string
          examples:
          - General
        message:
          description: Textual error description
          type: string
          examples:
          - The requested resource could not be found.
        details:
          description: Additional error details if necessary
          type:
          - object
          - 'null'
          examples:
          - null
        path:
          type:
          - string
          - 'null'
      type: object
    WorkTimesChangeRequestsDeclineV2:
      required:
      - id
      - date
      - users_id
      - status
      - created_at
      - declined_at
      - declined_by
      - changes
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
        users_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        created_at:
          type:
          - string
          - 'null'
        declined_at:
          type:
          - string
          - 'null'
        declined_by:
          type:
          - integer
          - 'null'
          format: int64
        changes:
          type: array
          items:
            $ref: '#/components/schemas/WorkTimesChangeRequestsDeclineChangeV2'
      type: object
    WorkTimeV2:
      required:
      - date
      - users_id
      - offset
      - intervals
      properties:
        date:
          type: string
          format: date
        users_id:
          type: integer
          format: int64
        offset:
          title: Additional work time that does not result form the day's intervals
          description: Only possible for days before 2023-01-01; can be positive or negative.
          type: integer
          format: int64
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/WorkTimeIntervalV2'
      type: object
    ChangeRequestScope:
      title: Change request scope
      description: 'Possible values:

        - `approve`: Approve'
      type: string
      enum:
      - approve
      x-enumNames:
      - Approve
    WorkTimesChangeRequestPostV2:
      required:
      - change_request
      - replaced_change_request
      - approved_immediately
      properties:
        change_request:
          oneOf:
          - $ref: '#/components/schemas/WorkTimesChangeRequestV2'
          - type: 'null'
        replaced_change_request:
          oneOf:
          - $ref: '#/components/schemas/WorkTimesChangeRequestV2'
          - type: 'null'
        approved_immediately:
          type: boolean
      type: object
    WorkTimeIntervalV2:
      required:
      - time_since
      - time_until
      properties:
        time_since:
          type: string
          format: date-time
        time_until:
          type:
          - string
          - 'null'
          format: date-time
      type: object
    WorkTimesChangeRequestDeleteV2:
      required:
      - change_request
      properties:
        change_request:
          type: 'null'
      type: object
    SortIdDate:
      title: Sort id date
      description: 'Possible values:

        - `date`: DateAsc

        - `-date`: DateDesc

        - `id`: IdAsc

        - `-id`: IdDesc'
      type: string
      enum:
      - date
      - -date
      - id
      - -id
      x-enumNames:
      - DateAsc
      - DateDesc
      - IdAsc
      - IdDesc
    ChangeRequestStatus:
      title: Change request status
      description: 'Possible values:

        - `1`: Requested

        - `2`: Declined'
      type: integer
      enum:
      - 1
      - 2
      x-enumNames:
      - Requested
      - Declined
    GeneralErrors:
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrors'
      type: object
    SimpleErrorResponses:
      title: Simple error response
      properties:
        error:
          $ref: '#/components/schemas/SimpleErrors'
      type: object
    WorkTimesChangeRequestChangeV2:
      required:
      - type
      - time_since
      - time_until
      properties:
        type:
          $ref: '#/components/schemas/ChangeRequestIntervalType'
        time_since:
          type: string
          format: date-time
        time_until:
          type: string
          format: date-time
      type: object
    SimpleErrors:
      title: Simple error
      required:
      - code
      - message
      properties:
        code:
          description: HTTP status code
          type: integer
        message:
          description: An error occurred
          type: string
        fields:
          description: Affected fields
          type: array
          items:
            type: string
      type: object
    WorkTimesChangeRequestV2:
      required:
      - id
      - date
      - users_id
      - status
      - created_at
      - declined_at
      - declined_by
      - changes
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        users_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ChangeRequestStatus'
        created_at:
          type: string
          format: date-time
        declined_at:
          type:
          - string
          - 'null'
          format: date-time
        declined_by:
          title: ID of the user who declined the change request
          type:
          - integer
          - 'null'
          format: int64
        changes:
          type: array
          items:
            $ref: '#/components/schemas/WorkTimesChangeRequestChangeV2'
      type: object
  securitySchemes:
    BasicAuth:
      type: http
      description: The basic authentication of the HTTP protocol. Credentials are email address and API key.<br />Every co-worker will find his API key in the menu item "Personal data" in his Clockodo account.
      scheme: basic
    User:
      type: apiKey
      description: 'Must be filled together with <code>X-ClockodoApiKey</code><br /><strong>Example: admin@clockodo.com</strong>'
      name: X-ClockodoApiUser
      in: header
    Key:
      type: apiKey
      description: Must be filled together with <code>X-ClockodoApiUser</code>
      name: X-ClockodoApiKey
      in: header
    ExternalApp:
      type: apiKey
      description: 'Every request to our API must provide identification of the calling application, including the email address of a technical contact person.<br /><strong>Example: "Clockodo;admin@clockodo.com"</strong>'
