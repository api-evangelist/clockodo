openapi: 3.2.0
info:
  title: Clockodo Absences API
  version: '2'
  description: Clockodo is a cloud-based time-tracking and project-management application for businesses.
  contact:
    name: Clockodo Support
    url: https://www.clockodo.com/en/contact/
  license:
    name: Clockodo Terms and Conditions
    url: https://www.clockodo.com/en/terms-and-conditions/
servers:
- url: https://my.clockodo.com/api
  description: Clockodo Production API
security:
- clockodoApiKey: []
- basicAuth: []
tags:
- name: Absences
  description: Absence records (vacation, sickness, etc.).
paths:
  /absences:
    get:
      operationId: listAbsences
      summary: List absences
      tags:
      - Absences
      responses:
        '200':
          description: Absences.
    post:
      operationId: createAbsence
      summary: Create an absence
      tags:
      - Absences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created absence.
  /absences/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      operationId: getAbsence
      summary: Get an absence
      tags:
      - Absences
      responses:
        '200':
          description: Absence.
    put:
      operationId: updateAbsence
      summary: Update an absence
      tags:
      - Absences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated absence.
    delete:
      operationId: deleteAbsence
      summary: Delete an absence
      tags:
      - Absences
      responses:
        '204':
          description: Absence deleted.
components:
  securitySchemes:
    clockodoApiKey:
      type: apiKey
      in: header
      name: X-ClockodoApiKey
      description: Per-user API key. Must be paired with the X-ClockodoApiUser header carrying the user's email address.
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic auth using the user's email as the username and the API key as the password.
