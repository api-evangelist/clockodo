tags:
- name: TargetHour
  description: Manage target hours (planned hours)
paths:
  /targethours:
    get:
      tags:
      - TargetHour
      operationId: getTargetHours
      parameters:
      - name: users_id
        in: query
        required: false
        schema:
          oneOf:
          - type: array
            items:
              type: integer
              maximum: 500
          - type: integer
            maximum: 500
          - type: string
            format: csv-string
            x-csv-element-schema:
              type: integer
              maximum: 500
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - targethours
                properties:
                  targethours:
                    type: array
                    items:
                      $ref: '#/components/schemas/TargetHourV1'
                type: object
      deprecated: false
      summary: Get target hours
      x-summary-source: derived
