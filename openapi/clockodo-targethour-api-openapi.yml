                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                monday:
                  type: number
                  format: float
                  maximum: 24
                  minimum: 0
                tuesday:
                  type: number
                  format: float
                  maximum: 24
                  minimum: 0
                wednesday:
                  type: number
                  format: float
                  maximum: 24
                  minimum: 0
                thursday:
                  type: number
                  format: float
                  maximum: 24
                  minimum: 0
                friday:
                  type: number
                  format: float
                  maximum: 24
                  minimum: 0
                saturday:
                  type: number
                  format: float
                  maximum: 24
                  minimum: 0
                sunday:
                  type: number
                  format: float
                  maximum: 24
                  minimum: 0
                monthly_target:
