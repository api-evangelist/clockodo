tags:
- name: UserReport
  description: Query user reports (e. g. work time evaluation of each day and holiday account of each co-worker)
paths:
  /userreports:
    get:
      tags:
      - UserReport
      operationId: getUserreports
      parameters:
      - name: type
        in: query
        description: 'Possible values:

          - `0`: Only for year (default)

          - `1`: For year and months

          - `2`: For year, months and weeks

          - `3`: For year, months, weeks and days

          - `4`: For year, months, weeks and days; including start and end times and breaks'
        required: false
        schema:
          $ref: '#/components/schemas/UserReportType'
      - name: year
        in: query
        required: true
        schema:
          type: integer
          maximum: 2027
          minimum: 1910
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - userreports
                properties:
                  userreports:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReportV1'
                type: object
      deprecated: false
      summary: Get userreports
      x-summary-source: derived
  /userreports/{id}:
    get:
      tags:
      - UserReport
      operationId: getUserreportById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserReportType'
      - name: year
        in: query
        required: true
        schema:
          type: integer
          maximum: 2027
          minimum: 1910
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - userreport
                properties:
                  userreport:
                    $ref: '#/components/schemas/UserReportV1'
                type: object
      deprecated: false
      summary: Get userreport by id
      x-summary-source: derived
