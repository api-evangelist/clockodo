components:
  schemas:
    ApiErrors:
      properties:
        type:
          description: Unique identifier of the error
          type: string
          examples:
          - General
        message:
          description: Textual error description
          type: string
          examples:
          - The requested resource could not be found.
        details:
          description: Additional error details if necessary
          type:
          - object
          - 'null'
          examples:
          - null
        path:
          type:
          - string
          - 'null'
      type: object
    customer_projects_access_v2:
      required:
      - add
      - report
      - edit
      properties:
        add:
          oneOf:
          - $ref: '#/components/schemas/general_access_v2'
          - $ref: '#/components/schemas/custom_access_v2'
          examples:
          - true
        report:
          oneOf:
          - $ref: '#/components/schemas/general_access_v2'
          - $ref: '#/components/schemas/custom_access_v2'
          examples:
          - '123': true
            '456': true
        edit:
          oneOf:
          - $ref: '#/components/schemas/general_access_v2'
          - $ref: '#/components/schemas/custom_access_v2'
          examples:
          - '123': true
            '456':
              projects:
                '789': true
      type: object
    ApiAccessGroupsServicesV2_AccessTypeForPut:
      title: Access type for put
      description: 'Possible values:

        - `add`: AddData'
      type: string
      enum:
      - add
      x-enumNames:
      - AddData
    BlockingAccessDependenciesError:
      title: Blocking access dependencies error
      properties:
        type:
          type: string
          enum:
          - BlockingAccessDependencies
        message:
          type:
          - string
          - 'null'
          examples:
          - Blocking dependencies need to be removed beforehand.
        path:
          type:
          - string
          - 'null'
        details:
          $ref: '#/components/schemas/BlockingAccessDependencies'
      type: object
      x-error-category: Forbidden
    services_access_v2:
      required:
      - add
      properties:
        add:
          oneOf:
          - $ref: '#/components/schemas/general_access_v2'
          - description: Access to selected services
            type: object
            additionalProperties:
              description: Key value pairs in the format {service id} => true
              type: boolean
              enum:
              - true
          examples:
          - '123': true
            '456': true
      type: object
    custom_access_v2:
      description: Access only to selected customers
      type: object
      additionalProperties:
        description: Key value pairs in the format {customer id} => true or {customer id} => {} for selected projects
        oneOf:
        - description: Access to selected customers
          type: boolean
          enum:
          - true
        - description: Access to selected projects
          required:
          - projects
          properties:
            projects:
              type: object
              additionalProperties:
                description: Key value pairs in the format {project id} => true
                type: boolean
                enum:
                - true
          type: object
    ApiAccessGroupsServicesV2_AccessValueForPut:
      title: Access value for put
      description: 'Possible values:

        - `0`: NoAccess

        - `1`: FullAccess'
      type: integer
      enum:
      - 0
      - 1
      x-enumNames:
      - NoAccess
      - FullAccess
    ApiAccessGroupsServicesGeneralV2_AccessTypeForPut:
      title: Access type for put
      description: 'Possible values:

        - `add`: AddData'
      type: string
      enum:
      - add
      x-enumNames:
      - AddData
    BlockingAccessDependencies:
      title: There are blocking access dependencies that need to be removed beforehand
      required:
      - access_name
      properties:
        access_name:
          description: The access you were trying to remove
          type: string
          examples:
          - see_absences
        elevated_access_dependencies:
          description: Elevated access dependencies that are blocking
          type: array
          items:
            type: string
          examples:
          - - see_work_time
            - manage_work_time
      type: object
    AccessValue:
      title: Access value
      description: 'Possible values:

        - `0`: NoAccess

        - `1`: FullAccess

        - `2`: CustomAccess'
      type: integer
      enum:
      - 0
      - 1
      - 2
      x-enumNames:
      - NoAccess
      - FullAccess
      - CustomAccess
    ApiAccessGroupsProjectsV2_AccessValueForPut:
      title: Access value for put
      description: 'Possible values:

        - `0`: NoAccess

        - `1`: FullAccess'
      type: integer
      enum:
      - 0
      - 1
      x-enumNames:
      - NoAccess
      - FullAccess
    ApiAccessGroupsCustomersGeneralV2Errors:
      title: Api access groups customers general v2 errors
      required:
      - error
      properties:
        error:
          title: Errors
          type: object
          anyOf:
          - $ref: '#/components/schemas/ForbiddenChangeToCustomAccessError'
          - $ref: '#/components/schemas/BlockingAccessDependenciesError'
      type: object
    GeneralErrors:
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrors'
      type: object
    ForbiddenChangeToCustomAccessError:
      title: Forbidden change to custom access error
      properties:
        type:
          type: string
          enum:
          - ForbiddenChangeToCustomAccess
        message:
          type:
          - string
          - 'null'
          examples:
          - Change to selected access is only possible from yes.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: Forbidden
    general_access_v2:
      description: General access
      type: boolean
    ApiAccessGroupsServicesGeneralV2Errors:
      title: Api access groups services general v2 errors
      required:
      - error
      properties:
        error:
          title: Errors
          type: object
          anyOf:
          - $ref: '#/components/schemas/ForbiddenChangeToCustomAccessError'
      type: object
    AccessType:
      title: Access type
      description: 'Possible values:

        - `add`: AddData

        - `report`: SeeReports

        - `edit`: EditReports'
      type: string
      enum:
      - add
      - report
      - edit
      x-enumNames:
      - AddData
      - SeeReports
      - EditReports
  securitySchemes:
    BasicAuth:
      type: http
      description: The basic authentication of the HTTP protocol. Credentials are email address and API key.<br />Every co-worker will find his API key in the menu item "Personal data" in his Clockodo account.
      scheme: basic
    User:
      type: apiKey
      description: 'Must be filled together with <code>X-ClockodoApiKey</code><br /><strong>Example: admin@clockodo.com</strong>'
      name: X-ClockodoApiUser
      in: header
    Key:
      type: apiKey
      description: Must be filled together with <code>X-ClockodoApiUser</code>
      name: X-ClockodoApiKey
      in: header
    ExternalApp:
      type: apiKey
      description: 'Every request to our API must provide identification of the calling application, including the email address of a technical contact person.<br /><strong>Example: "Clockodo;admin@clockodo.com"</strong>'
      name: X-Clockodo-External-Application
      in: header
    OAuth2:
      type: oauth2
      description: OAuth 2.0 for external integrations via authorization code flow with refresh tokens. OAuth clients can be provisioned via Dynamic Client Registration (POST /oauth/register) or Client ID Metadata Documents (CIMD). Dynamically registered clients are deleted after 90 days without any token or authorization code activity; store the issued client_id and client_secret permanently, as the secret is only returned once.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /token
          refreshUrl: /token
          scopes:
            full_access: Full access to all API endpoints
            accessGroups:read: Read access group data
            accessGroups:write: Write access group data
            absences:read: Read absence data
            absences:write: Write absence data
            browserExtensionRules:read: Read browser extension rule data
            browserExtensionRules:write: Write browser extension rule data
            clock:read: Read clock data
            clock:write: Write clock data
            company:read: Read company data
            customers:read: Read customer data
            customers:write: Write customer data
            entryGroups:read: Read entry group data
            entryGroups:write: Write entry group data
            entries:read: Read time entry data
            entries:write: Write time entry data
            entriesTexts:read: Read time entry text data
            entriesTexts:write: Write time entry text data
            holidaysCarry:read: Read holiday carryover data
            holidaysCarry:write: Write holiday carryover data
            holidaysQuota:read: Read holiday quota data
            holidaysQuota:write: Write holiday quota data
            lumpSumServices:read: Read lump sum service data
            lumpSumServices:write: Write lump sum service data
            nonbusinessDays:read: Read nonbusiness day data
            nonbusinessDays:write: Write nonbusiness day data
            nonbusinessGroups:read: Read nonbusiness group data
            nonbusinessGroups:write: Write nonbusiness group data
            overtimeCarry:read: Read overtime carryover data
            overtimeCarry:write: Write overtime carryover data
            overtimeReductions:read: Read overtime reduction data
            overtimeReductions:write: Write overtime reduction data
            projects:read: Read project data
            projects:write: Write project data
            rates:read: Read rate data
            rates:write: Write rate data
            services:read: Read service data
            services:write: Write service data
            subprojects:read: Read subproject data
            subprojects:write: Write subproject data
            subscription:read: Read subscription data
            targetHours:read: Read planned hours data
            targetHours:write: Write planned hours data
            teams:read: Read team data
            teams:write: Write team data
            userReports:read: Read co-worker report data
            users:read: Read co-worker data
            users:write: Write co-worker data
            usersNonbusinessDays:read: Read co-worker nonbusiness day data
            usersNonbusinessGroups:read: Read co-worker nonbusiness group data
            usersNonbusinessGroups:write: Write co-worker nonbusiness group data
            workTimes:read: Read work time data
            workTimes:write: Write work time data
