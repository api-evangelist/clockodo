tags:
- name: AccessGroupAccess
  description: Manage access group rights
paths:
  /v2/accessGroups/{accessGroupsId}/customers:
    put:
      tags:
      - AccessGroupAccess
      operationId: updateAccessGroupCustomersByIdV2
      parameters:
      - name: accessGroupsId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - id
              - type
              - value
              properties:
                id:
                  type: integer
                  minimum: 1
                type:
                  $ref: '#/components/schemas/AccessType'
                value:
                  $ref: '#/components/schemas/AccessValue'
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer_projects_access_v2'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Update access group customers by id V2
      x-summary-source: derived
  /v2/accessGroups/{accessGroupsId}/customers/general:
    put:
      tags:
      - AccessGroupAccess
      operationId: updateAccessGroupCustomersGeneralByIdV2
      parameters:
      - name: accessGroupsId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - type
              - value
              properties:
                type:
                  $ref: '#/components/schemas/AccessType'
                value:
                  $ref: '#/components/schemas/AccessValue'
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer_projects_access_v2'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiAccessGroupsCustomersGeneralV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Update access group customers general by id V2
      x-summary-source: derived
