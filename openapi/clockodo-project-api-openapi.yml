                budget:
                  description: Use `null` for projects without budget. If a budget object is provided, `budget.amount` must be included.
                  properties:
                    amount:
                      description: For own project budget and interval budget, value must be greater than `0`. For `budget.from_subprojects=true`, value must be empty (`null` or `0`).
                      type:
                      - number
                      - 'null'
                      format: float
                      maximum: 99999999
                      minimum: 0
                    from_subprojects:
                      type: boolean
                    hard:
                      type: boolean
                    interval:
                      oneOf:
                      - $ref: '#/components/schemas/BudgetInterval'
                      - type: 'null'
                      x-requires_module: retainer
                    monetary:
                      type: boolean
                    notification_thresholds:
                      type: array
                      items:
                        $ref: '#/components/schemas/Thresholds'
                      x-requires_module: budget_notifications
                  type:
                  - object
                  - 'null'
                service_assignments:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  x-requires_permission: manage_services
                bill_service_id:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectV4'
