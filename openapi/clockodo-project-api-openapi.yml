      x-summary-source: derived
components:
  schemas:
    CannotChangeBudgetSourceBecauseOfSubprojectsError:
      title: Cannot change budget source because of subprojects error
      properties:
        type:
          type: string
          enum:
          - BudgetSourceIsNotChangedFromOrToIntervalWhenSubprojectsExist
        message:
          type:
          - string
          - 'null'
          examples:
          - You cannot change the budget source of interval projects as long as there are subprojects.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: Forbidden
    ResourceConflictFoundError:
      title: Resource conflict found error
      properties:
        type:
          type: string
          enum:
          - ResourceConflictFound
        message:
          type:
          - string
          - 'null'
          examples:
          - There is already a service with this name.
        path:
          type:
          - string
          - 'null'
        details:
          $ref: '#/components/schemas/Resource'
      type: object
      x-error-category: BadRequest
    ProjectCompletionTooManyLumpSumsError:
      title: Project completion too many lump sums error
      properties:
        type:
          type: string
          enum:
          - ProjectCompletionTooManyLumpSums
        message:
          type:
          - string
          - 'null'
          examples:
          - The project can't be set to completed. The sum of billable lump sums must not exceed the budget.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: Forbidden
    NotBetween:
      title: Not between error details
      description: The value is not between min and max
      required:
      - min
      - max
      - inclusive
      properties:
        min:
          title: Minimum value
          type: number
          examples:
          - 0
        max:
          title: Maximum value
          type: number
          examples:
          - 10000
        inclusive:
          title: Boundaries inclusive
          description: Are the minimum and maximum values allowed
          type: boolean
          examples:
          - true
      type: object
