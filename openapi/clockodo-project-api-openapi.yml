- OAuth2: []
tags:
- name: Project
  description: Manage projects
paths:
  /v2/projects/{id}/createNextInterval:
    post:
      tags:
      - Project
      operationId: createProjectNextIntervalByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SubprojectV3'
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create project next interval by id V2
      x-summary-source: derived
  /v3/projects/{id}/setBilled:
    put:
      tags:
      - Project
      operationId: updateProjectBilledByIdV3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                billed:
                  type: boolean
                billed_money:
                  type:
                  - number
                  - 'null'
                  format: float
                  maximum: 99999999
                  minimum: 0
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectV4'
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiProjectsSetBilledV3Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Update project billed by id V3
      x-summary-source: derived
  /v4/projects:
    get:
      tags:
      - Project
      operationId: getProjectsV4
      parameters:
      - name: filter
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          properties:
            active:
              type: boolean
            completed:
              type: boolean
            customers_id:
              type: integer
            fulltext:
              type: string
          type: object
      - name: items_per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          maximum: 5000
          minimum: 1
          examples:
          - 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          examples:
          - 1
      - name: scope
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CustomerProjectScope'
      - name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SortIdNameActive'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - paging
                - data
                properties:
                  paging:
                    required:
                    - items_per_page
                    - current_page
                    - count_pages
                    - count_items
                    properties:
                      items_per_page:
                        type: integer
                        format: int64
                        examples:
                        - 1000
                      current_page:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_pages:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_items:
                        type: integer
                        format: int64
                        examples:
                        - 4
                    type: object
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectV4'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get projects V4
      x-summary-source: derived
    post:
      tags:
      - Project
      operationId: createProjectV4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - name
              - customers_id
              properties:
                name:
                  type: string
                  maxLength: 100
                customers_id:
                  type: integer
                active:
                  type: boolean
                number:
                  description: Freely selectable number for the project
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                billable_default:
                  type: boolean
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
                deadline:
                  description: Date when the project will be completed automatically
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                start_date:
                  description: Date when the project becomes available for time tracking
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                automatic_completion:
                  type: boolean
                budget:
                  description: Use `null` for projects without budget. If a budget object is provided, `budget.amount` must be included.
                  properties:
                    amount:
                      description: For own project budget and interval budget, value must be greater than `0`. For `budget.from_subprojects=true`, value must be empty (`null` or `0`).
                      type:
                      - number
                      - 'null'
                      format: float
                      maximum: 99999999
                      minimum: 0
                    from_subprojects:
                      type: boolean
                    hard:
                      type: boolean
                    interval:
                      oneOf:
                      - $ref: '#/components/schemas/BudgetInterval'
                      - type: 'null'
                      x-requires_module: retainer
                    monetary:
                      type: boolean
                    notification_thresholds:
                      type: array
                      items:
                        $ref: '#/components/schemas/Thresholds'
                      x-requires_module: budget_notifications
                  type:
                  - object
                  - 'null'
                service_assignments:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  x-requires_permission: manage_services
                bill_service_id:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectV4'
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiProjectsV4Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create project V4
      x-summary-source: derived
  /v4/projects/{id}:
    get:
      tags:
      - Project
      operationId: getProjectByIdV4
      parameters:
