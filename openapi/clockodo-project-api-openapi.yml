        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  maxLength: 100
                customers_id:
                  type: integer
                active:
                  type: boolean
                number:
                  description: Freely selectable number for the project
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                billable_default:
                  type: boolean
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
                deadline:
                  description: Date when the project will be completed automatically
                  type:
                  - string
