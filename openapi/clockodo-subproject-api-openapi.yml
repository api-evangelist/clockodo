- BasicAuth: []
  ExternalApp: []
- User: []
  Key: []
  ExternalApp: []
- OAuth2: []
tags:
- name: Subproject
  description: Manage subprojects
paths:
  /v3/subprojects:
    get:
      tags:
      - Subproject
      operationId: getSubprojectsV3
      parameters:
      - name: filter
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          properties:
            active:
              type: boolean
            completed:
              type: boolean
            fulltext:
              type: string
            projects_id:
              type: integer
          type: object
      - name: items_per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          maximum: 5000
          minimum: 1
          examples:
          - 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          examples:
          - 1
      - name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SortIdNameActive'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - paging
                - data
                properties:
                  paging:
                    required:
                    - items_per_page
                    - current_page
                    - count_pages
                    - count_items
                    properties:
                      items_per_page:
                        type: integer
                        format: int64
                        examples:
                        - 1000
                      current_page:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_pages:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_items:
                        type: integer
                        format: int64
                        examples:
                        - 4
                    type: object
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubprojectV3'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get subprojects V3
      x-summary-source: derived
    post:
      tags:
      - Subproject
      operationId: createSubprojectV3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - projects_id
              - name
              properties:
                projects_id:
                  type: integer
                name:
                  type: string
                  maxLength: 100
                active:
                  type: boolean
                billable_default:
                  type: boolean
                budget:
                  properties:
                    amount:
                      type:
                      - number
                      - 'null'
                      format: float
                      maximum: 99999999.99
                      minimum: 0
                    hard:
                      type: boolean
                    monetary:
                      type: boolean
                    notification_thresholds:
                      type: array
                      items:
                        $ref: '#/components/schemas/Thresholds'
                      x-requires_module: budget_notifications
                  type:
                  - object
                  - 'null'
                number:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
                start_date:
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                deadline:
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                automatic_completion:
                  type: boolean
                service_assignments:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  x-requires_permission: manage_services
                bill_service_id:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SubprojectV3'
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiSubprojectsV3Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create subproject V3
      x-summary-source: derived
  /v3/subprojects/{id}:
    get:
      tags:
      - Subproject
      operationId: getSubprojectByIdV3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SubprojectV3'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get subproject by id V3
      x-summary-source: derived
    put:
      tags:
      - Subproject
      operationId: updateSubprojectByIdV3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  maxLength: 100
                active:
                  type: boolean
                billable_default:
                  type: boolean
                budget:
                  properties:
                    amount:
                      type:
                      - number
                      - 'null'
                      format: float
                      maximum: 99999999.99
                      minimum: 0
                    hard:
                      type: boolean
                    monetary:
                      type: boolean
                    notification_thresholds:
                      type: array
                      items:
                        $ref: '#/components/schemas/Thresholds'
                      x-requires_module: budget_notifications
                  type:
                  - object
                  - 'null'
                number:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
                start_date:
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                deadline:
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                automatic_completion:
                  type: boolean
                service_assignments:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  x-requires_permission: manage_services
                bill_service_id:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SubprojectV3'
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiSubprojectsV3Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Update subproject by id V3
      x-summary-source: derived
    delete:
      tags:
      - Subproject
      operationId: deleteSubprojectByIdV3
      parameters:
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
      - name: force
        in: query
        required: false
        schema:
          type: boolean
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - success
                properties:
                  success:
                    title: Success
                    type: boolean
                    examples:
                    - true
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiSubprojectsV3Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Delete subproject by id V3
      x-summary-source: derived
  /v3/subprojects/{id}/complete:
    put:
      tags:
      - Subproject
      operationId: completeSubprojectByIdV3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - completed
              properties:
                completed:
                  type: boolean
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SubprojectV3'
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiSubprojectsCompleteV3Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Complete subproject by id V3
      x-summary-source: derived
components:
  schemas:
    ActivationForInactiveProjectIsForbiddenError:
      title: Activation for inactive project is forbidden error
      properties:
        type:
          type: string
          enum:
          - ActivationForInactiveProjectIsForbidden
        message:
          type:
          - string
          - 'null'
          examples:
          - Subprojects from inactive projects cannot be reactivated.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: Forbidden
    SubprojectDeadlineIsNotBeforeSubprojectStartError:
      title: Subproject deadline is not before subproject start error
      properties:
        type:
          type: string
          enum:
          - SubprojectDeadlineIsNotBeforeSubprojectStart
        message:
          type:
          - string
          - 'null'
          examples:
          - Deadline must be after or equal to start date.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: BadRequest
    NotBetween:
      title: Not between error details
      description: The value is not between min and max
      required:
      - min
      - max
      - inclusive
      properties:
        min:
          title: Minimum value
          type: number
          examples:
          - 0
        max:
          title: Maximum value
          type: number
          examples:
          - 10000
        inclusive:
          title: Boundaries inclusive
          description: Are the minimum and maximum values allowed
          type: boolean
          examples:
          - true
      type: object
    RequiresBudgetError:
      title: Requires budget error
      properties:
        type:
          type: string
          enum:
          - RequiresBudget
        message:
          type:
          - string
          - 'null'
          examples:
          - A budget is required when budget type is hard.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: BadRequest
    ResourceConflictFoundError:
      title: Resource conflict found error
      properties:
        type:
          type: string
          enum:
          - ResourceConflictFound
        message:
          type:
          - string
          - 'null'
          examples:
          - There is already a service with this name.
        path:
          type:
          - string
          - 'null'
        details:
          $ref: '#/components/schemas/Resource'
      type: object
      x-error-category: BadRequest
    SubprojectBudgetModificationIsProhibitedBecauseItIsCompletedError:
      title: Subproject budget modification is prohibited because it is completed error
      properties:
        type:
          type: string
          enum:
          - SubprojectBudgetModificationIsProhibitedBecauseItIsCompleted
        message:
          type:
          - string
          - 'null'
          examples:
          - You cannot edit subproject budget data because the subproject is already completed.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: Forbidden
    ServiceDoesNotExist:
      title: Service does not exist error details
      properties:
        non_existent_ids:
          type: array
          items:
            type: integer
            format: int64
      type: object
    ApiSubprojectsCompleteV3Errors:
      title: Api subprojects complete v3 errors
      required:
      - error
      type: object
      allOf:
      - $ref: '#/components/schemas/ApiSubprojectsV3Errors'
      - properties:
          error:
            title: Errors
            type: object
            anyOf:
            - $ref: '#/components/schemas/ActivationForInactiveProjectIsForbiddenError'
            - $ref: '#/components/schemas/ArchivingNonRetainerSubprojectIsForbiddenError'
            - $ref: '#/components/schemas/CreationForInactiveProjectIsForbiddenError'
            - $ref: '#/components/schemas/DisableSubprojectAsWorkerIsForbiddenError'
            - $ref: '#/components/schemas/EditInactiveSubprojectAsWorkerIsForbiddenError'
            - $ref: '#/components/schemas/SubprojectsCanNotBeSetToBilledError'
            - $ref: '#/components/schemas/UnexpectedValueError'
            - $ref: '#/components/schemas/SubprojectBudgetCommitmentNotEditableForBudgetSourceError'
            - $ref: '#/components/schemas/NotBetweenError'
            - $ref: '#/components/schemas/SubprojectBudgetTypeNotEditableForBudgetSourceError'
            - $ref: '#/components/schemas/RequiresBudgetError'
            - $ref: '#/components/schemas/SubprojectBudgetModificationIsProhibitedBecauseItIsCompletedError'
            - $ref: '#/components/schemas/SubprojectCompletionNoBillableEntriesError'
            - $ref: '#/components/schemas/SubprojectCompletionAnyRunningEntriesError'
            - $ref: '#/components/schemas/IntervalSubprojectMustHaveBudgetError'
            - $ref: '#/components/schemas/SubprojectIsCompletedError'
            - $ref: '#/components/schemas/SubprojectCreationWithBudgetIsProhibitedError'
            - $ref: '#/components/schemas/SubprojectCompletionTooManyLumpSumsError'
            - $ref: '#/components/schemas/ResourceConflictFoundError'
            - $ref: '#/components/schemas/RelationsPreventDeletionError'
            - $ref: '#/components/schemas/RunningEntriesPreventDeletionError'
            - $ref: '#/components/schemas/BudgetTotalError'
            - $ref: '#/components/schemas/ResourceNotFoundError'
            - $ref: '#/components/schemas/ProjectIsCompletedError'
            - $ref: '#/components/schemas/SubprojectCompletionWithHardBudgetIsProhibitedForCompletedProjectsError'
            - $ref: '#/components/schemas/BudgetTotalExceedsAbsoluteMaximumError'
            - $ref: '#/components/schemas/ShouldNotHaveBudgetError'
            - $ref: '#/components/schemas/SubprojectDeadlineIsNotBeforeSubprojectStartError'
            - $ref: '#/components/schemas/SubprojectPeriodMustContainAllEntryStartsError'
            - $ref: '#/components/schemas/SubprojectPeriodIsNotWithinProjectsPeriodError'
        type: object
    SubprojectIsCompletedError:
      title: Subproject is completed error
      properties:
        type:
          type: string
          enum:
          - SubprojectIsCompleted
        message:
          type:
          - string
          - 'null'
          examples:
