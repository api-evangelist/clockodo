    ArchivingNonRetainerSubprojectIsForbiddenError:
      title: Archiving non retainer subproject is forbidden error
      properties:
        type:
          type: string
          enum:
          - ArchivingNonRetainerSubprojectIsForbidden
        message:
          type:
          - string
          - 'null'
          examples:
          - Subprojects can only be archived for retainer projects. To remove this subproject, please delete it instead.
        path:
