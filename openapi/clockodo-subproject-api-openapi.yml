        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: Forbidden
    ProjectIsCompletedError:
      title: Project is completed error
      properties:
        type:
          type: string
          enum:
          - ProjectIsCompleted
        message:
          type:
          - string
          - 'null'
          examples:
          - The project is completed.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: Forbidden
    ApiErrors:
      properties:
        type:
          description: Unique identifier of the error
          type: string
          examples:
          - General
        message:
          description: Textual error description
          type: string
          examples:
          - The requested resource could not be found.
        details:
          description: Additional error details if necessary
          type:
          - object
