          examples:
          - null
        path:
          type:
          - string
          - 'null'
      type: object
    SortIdNameActive:
      title: Sort id name active
      description: 'Possible values:

        - `active`: ActiveAsc

        - `-active`: ActiveDesc

        - `id`: IdAsc

        - `-id`: IdDesc

