tags:
- name: NonbusinessGroup
  description: Query and manage nonbusiness groups
paths:
  /v2/nonbusinessGroups:
    get:
      tags:
      - NonbusinessGroup
      operationId: getNonbusinessGroupsV2
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NonbusinessGroupV2'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get nonbusiness groups V2
      x-summary-source: derived
    post:
      tags:
      - NonbusinessGroup
      operationId: createNonbusinessGroupV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 100
                preset:
                  type: string
                  enum:
                  - germany_by_bw
                  - germany_be
                  - germany_bb
                  - germany_hb-hh-ni-sh
                  - germany_he
                  - germany_mv
                  - germany_nw-rp
                  - germany_sl
                  - germany_sn
                  - germany_st
                  - germany_th
                  - austria_b
                  - austria_k
                  - austria_n_w
                  - austria_o
                  - austria_s
                  - austria_st_t_v
                  - switzerland
                  - australia
                  - belgium
                  - denmark
                  - france
                  - gb
                  - italy
                  - canada
                  - netherlands
                  - norway
                  - poland
                  - portugal
                  - russia
                  - sweden
                  - spain
                  - czech
                  - usa
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NonbusinessGroupV2'
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiNonbusinessGroupsV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create nonbusiness group V2
      x-summary-source: derived
  /v2/nonbusinessGroups/{id}:
    get:
      tags:
      - NonbusinessGroup
      operationId: getNonbusinessGroupByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NonbusinessGroupV2'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get nonbusiness group by id V2
      x-summary-source: derived
    put:
      tags:
      - NonbusinessGroup
      operationId: updateNonbusinessGroupByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  maxLength: 100
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NonbusinessGroupV2'
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiNonbusinessGroupsV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Update nonbusiness group by id V2
      x-summary-source: derived
    delete:
      tags:
      - NonbusinessGroup
      operationId: deleteNonbusinessGroupByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - success
                properties:
                  success:
                    title: Success
                    type: boolean
                    examples:
                    - true
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiNonbusinessGroupsV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Delete nonbusiness group by id V2
      x-summary-source: derived
