tags:
- name: Absence
  description: Manage absences (holidays, sick days, etc.)
paths:
  /v4/absences:
    get:
      tags:
      - Absence
      operationId: getAbsencesV4
      parameters:
      - name: filter
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          properties:
            status:
              oneOf:
              - type: array
                items:
                  $ref: '#/components/schemas/AbsenceStatus'
                maxItems: 500
              - $ref: '#/components/schemas/AbsenceStatus'
              - type: string
                format: csv-string
                x-csv-element-schema:
                  $ref: '#/components/schemas/AbsenceStatus'
            teams_id:
              oneOf:
              - type: array
                items:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                maxItems: 500
              - type:
                - integer
                - 'null'
                minimum: 1
              - type: string
                format: csv-string
                x-csv-element-schema:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
            type:
              oneOf:
              - type: array
                items:
                  $ref: '#/components/schemas/AbsenceType'
                maxItems: 500
              - $ref: '#/components/schemas/AbsenceType'
              - type: string
                format: csv-string
                x-csv-element-schema:
                  $ref: '#/components/schemas/AbsenceType'
            users_active:
              type: boolean
            users_id:
              oneOf:
              - type: array
                items:
                  type: integer
                  minimum: 1
                maxItems: 500
              - type: integer
                minimum: 1
              - type: string
                format: csv-string
                x-csv-element-schema:
                  type: integer
                  minimum: 1
            year:
              oneOf:
              - type: array
                items:
                  type: integer
                  maximum: 2037
                  minimum: 2000
                maxItems: 500
              - type: integer
                maximum: 2037
                minimum: 2000
              - type: string
                format: csv-string
                x-csv-element-schema:
                  type: integer
                  maximum: 2037
                  minimum: 2000
          type: object
      - name: scope
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AbsenceScope'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AbsenceV4'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get absences V4
      x-summary-source: derived
    post:
      tags:
      - Absence
      operationId: createAbsenceV4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - date_since
              - type
              properties:
                date_since:
                  type: string
                  format: date
                  examples:
                  - '2023-02-28'
                date_until:
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                type:
                  $ref: '#/components/schemas/AbsenceType'
                half_day:
                  type: boolean
                count_hours:
                  type:
                  - number
                  - 'null'
                  format: float
                  maximum: 1000
                  minimum: 0.01
                users_id:
                  type: integer
                  minimum: 1
                allow_override:
                  description: IDs of absences that may be shortened or deleted to avoid conflicts
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  maxItems: 500
                status:
                  $ref: '#/components/schemas/AbsenceStatus'
                sick_note:
                  type: boolean
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 512
                public_note:
                  type:
                  - string
                  - 'null'
                  maxLength: 512
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AbsenceV4'
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiAbsencesV4Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create absence V4
      x-summary-source: derived
  /v4/absences/{id}:
    get:
      tags:
      - Absence
      operationId: getAbsenceByIdV4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AbsenceV4'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get absence by id V4
      x-summary-source: derived
    put:
      tags:
      - Absence
      operationId: updateAbsenceByIdV4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                date_since:
                  type: string
                  format: date
                  examples:
                  - '2023-02-28'
                date_until:
                  type: string
                  format: date
                  examples:
                  - '2023-02-28'
                type:
                  $ref: '#/components/schemas/AbsenceType'
                half_day:
                  type: boolean
                count_hours:
                  type:
                  - number
                  - 'null'
                  format: float
                  maximum: 1000
                  minimum: 0.01
                allow_override:
                  description: IDs of absences that may be shortened or deleted to avoid conflicts
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  maxItems: 500
                status:
                  $ref: '#/components/schemas/AbsenceStatus'
                sick_note:
                  type: boolean
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 512
                public_note:
                  type:
                  - string
                  - 'null'
                  maxLength: 512
                mail_approval_token:
                  description: Token from the approval link of the request mail. If given, the update is rejected unless the token belongs to this absence in its current state and to the current user.
                  type: string
                  maxLength: 100
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AbsenceV4'
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiAbsencesV4Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Update absence by id V4
      x-summary-source: derived
    delete:
      tags:
      - Absence
      operationId: deleteAbsenceByIdV4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - success
                properties:
                  success:
                    title: Success
                    type: boolean
                    examples:
                    - true
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiAbsencesV4Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Delete absence by id V4
      x-summary-source: derived
components:
  schemas:
    AbsenceDayAbsenceV4:
      required:
      - id
      - users_id
      - date_since
      - date_until
      - status
      - public_note
      - count_days
      properties:
        id:
          type: integer
        users_id:
          type: integer
        date_since:
          type: string
          format: date
        date_until:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/DayAbsenceType'
          description: Only with access rights for absence administration or in case of own absences
        status:
          $ref: '#/components/schemas/AbsenceStatus'
        note:
          description: Only with access rights for absence administration or in case of own absences
          type:
          - string
          - 'null'
        public_note:
          type:
          - string
          - 'null'
        sick_note:
          description: Only with access rights for absence administration or in case of own absences. Only for types 4 (SickSelf) and 5 (SickChild). Null in case of other absences.
          type:
          - boolean
          - 'null'
        count_days:
          title: Amount of absence days
          description: Null in case of overtime reduction.
          type: number
          format: float
        count_hours:
          title: Amount of hours of overtime reduction
          description: Only with access rights for absence administration or in case of own absences. Null in case of other absences.
          type: 'null'
        date_enquired:
          description: Only with access rights for absence administration or in case of own absences
