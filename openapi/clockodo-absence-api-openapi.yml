      - School
      - MaternityProtection
      - HomeOffice
      - OutOfOffice
      - SpecialLeaveUnpaid
      - SickSelfUnpaid
      - SickChildUnpaid
      - Quarantine
      - MilitaryService
      - SickSelfWithCertificate
