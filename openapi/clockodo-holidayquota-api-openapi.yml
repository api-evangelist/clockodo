tags:
- name: HolidayQuota
  description: Manage holiday quotas
paths:
  /v2/holidaysQuota:
    get:
      tags:
      - HolidayQuota
      operationId: getHolidayQuotasV2
      parameters:
      - name: filter
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          properties:
            users_id:
              type: integer
              minimum: 1
            year:
              type: integer
              maximum: 2037
              minimum: 2000
          type: object
      - name: users_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: year
        in: query
        required: false
        schema:
          type: integer
          maximum: 2037
          minimum: 2000
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HolidaysQuotaV2'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get holiday quotas V2
      x-summary-source: derived
    post:
      tags:
      - HolidayQuota
      operationId: createHolidayQuotaV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - users_id
              - year_since
              - count
              properties:
                users_id:
                  type: integer
                  minimum: 1
                year_since:
                  description: Year from which on the vacation quota setting applies.
                  type: integer
                  format: YYYY
                  maximum: 2037
                  minimum: 2000
                  examples:
                  - 2023
                year_until:
                  description: Year until the vacation quota setting applies.
                  type:
                  - integer
                  - 'null'
                  format: YYYY
                  maximum: 2037
                  minimum: 2000
                  examples:
                  - 2023
                count:
                  description: Amount of vacation days.
                  type: number
                  format: float
                  maximum: 365
                  minimum: 0
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/HolidaysQuotaV2'
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiHolidaysQuotaV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create holiday quota V2
      x-summary-source: derived
  /v2/holidaysQuota/{id}:
    get:
      tags:
      - HolidayQuota
      operationId: getHolidayQuotaByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/HolidaysQuotaV2'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get holiday quota by id V2
      x-summary-source: derived
    put:
      tags:
      - HolidayQuota
      operationId: updateHolidayQuotaByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                year_since:
                  description: Year from which on the vacation quota setting applies.
                  type: integer
                  format: YYYY
                  maximum: 2037
                  minimum: 2000
                  examples:
                  - 2023
                year_until:
                  description: Year until the vacation quota setting applies.
                  type:
                  - integer
                  - 'null'
                  format: YYYY
                  maximum: 2037
                  minimum: 2000
                  examples:
                  - 2023
                count:
                  description: Amount of vacation days.
                  type: number
                  format: float
                  maximum: 365
                  minimum: 0
                note:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/HolidaysQuotaV2'
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiHolidaysQuotaV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Update holiday quota by id V2
      x-summary-source: derived
    delete:
      tags:
      - HolidayQuota
      operationId: deleteHolidayQuotaByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - success
                properties:
                  success:
                    title: Success
                    type: boolean
                    examples:
                    - true
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiHolidaysQuotaV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Delete holiday quota by id V2
      x-summary-source: derived
components:
  schemas:
    IsDefaultHolidaysCountError:
      title: Is default holidays count error
      properties:
        type:
          type: string
