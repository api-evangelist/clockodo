          - IsDefaultHolidaysCount
        message:
          type:
          - string
          - 'null'
          examples:
          - It is not allowed to delete a holidays quota which is user default.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: Forbidden
    FieldsShouldBeEmptyError:
