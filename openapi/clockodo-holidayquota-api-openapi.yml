          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: BadRequest
    ApiErrors:
      properties:
        type:
          description: Unique identifier of the error
          type: string
          examples:
          - General
        message:
          description: Textual error description
          type: string
          examples:
          - The requested resource could not be found.
        details:
          description: Additional error details if necessary
          type:
          - object
          - 'null'
          examples:
          - null
        path:
          type:
          - string
          - 'null'
      type: object
    OneOpenEndedQuotaError:
      title: One open ended quota error
      properties:
        type:
          type: string
          enum:
          - OneOpenEndedQuota
        message:
          type:
          - string
          - 'null'
          examples:
          - There must be only one open ended holidays quota.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: BadRequest
    HolidaysQuotaV2:
      required:
      - id
      - users_id
      - year_since
      - year_until
      - count
      properties:
        id:
          type: integer
          format: int64
          examples:
          - 10
        users_id:
          type: integer
          format: int64
          examples:
          - 20
        year_since:
          type: integer
          format: int64
          examples:
          - '2023'
        year_until:
          type:
          - integer
          - 'null'
          format: int64
          examples:
          - '2024'
        count:
          type: number
          format: float
          examples:
          - 3.5
        note:
          type:
          - string
          - 'null'
