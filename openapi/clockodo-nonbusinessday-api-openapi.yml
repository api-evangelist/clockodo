tags:
- name: NonbusinessDay
  description: Query and manage nonbusiness days
paths:
  /v2/nonbusinessDays:
    get:
      tags:
      - NonbusinessDay
      operationId: getNonbusinessDaysV2
      parameters:
      - name: nonbusiness_group_id
        in: query
        required: false
        schema:
          oneOf:
          - type: array
            items:
              type: integer
              minimum: 1
            maxItems: 500
          - type: integer
            minimum: 1
          - type: string
            format: csv-string
            x-csv-element-schema:
              type: integer
              minimum: 1
      - name: year
        in: query
        required: false
        schema:
          type: integer
          maximum: 2037
          minimum: 2000
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NonbusinessDayV2'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get nonbusiness days V2
      x-summary-source: derived
    post:
      tags:
      - NonbusinessDay
      operationId: createNonbusinessDayV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - nonbusiness_group_id
              - type
              - name
              properties:
                nonbusiness_group_id:
                  description: 'Default: Company default nonbusiness group'
                  type: integer
                  minimum: 1
                type:
                  $ref: '#/components/schemas/NonbusinessDayType'
                name:
                  type: string
                  maxLength: 100
                half_day:
                  type: boolean
                surcharge_special:
                  type: boolean
                special_id:
                  type: integer
                  minimum: 1
                day:
                  type: integer
                  maximum: 31
                  minimum: 1
                month:
                  type: integer
                  maximum: 12
                  minimum: 1
                year:
                  type: integer
                  maximum: 2037
                  minimum: 2000
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NonbusinessDayV2'
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiNonbusinessDaysV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create nonbusiness day V2
      x-summary-source: derived
  /v2/nonbusinessDays/{id}:
    get:
      tags:
      - NonbusinessDay
      operationId: getNonbusinessDayByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      - name: year
        in: query
        required: false
        schema:
          type: integer
          maximum: 2037
          minimum: 2000
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NonbusinessDayV2'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get nonbusiness day by id V2
      x-summary-source: derived
    put:
      tags:
      - NonbusinessDay
      operationId: updateNonbusinessDayByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                type:
                  $ref: '#/components/schemas/NonbusinessDayType'
                name:
                  type: string
                  maxLength: 100
                half_day:
                  type: boolean
                surcharge_special:
                  type: boolean
                special_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                day:
                  type:
                  - integer
                  - 'null'
                  maximum: 31
                  minimum: 1
                month:
                  type:
                  - integer
                  - 'null'
                  maximum: 12
                  minimum: 1
                year:
                  type:
                  - integer
                  - 'null'
                  maximum: 2037
                  minimum: 2000
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NonbusinessDayV2'
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiNonbusinessDaysV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Update nonbusiness day by id V2
      x-summary-source: derived
    delete:
      tags:
      - NonbusinessDay
      operationId: deleteNonbusinessDayByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - success
                properties:
                  success:
                    title: Success
                    type: boolean
                    examples:
                    - true
                type: object
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiNonbusinessDaysV2Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Delete nonbusiness day by id V2
      x-summary-source: derived
components:
  schemas:
    NonbusinessDayType:
      title: Nonbusiness day type
      description: 'Possible values:

        - `SPECIAL`: Special

        - `DISTINCT_ONCE`: DistinctOnce

        - `DISTINCT_RECURRING`: DistinctRecurring'
      type: string
      enum:
      - SPECIAL
      - DISTINCT_ONCE
      - DISTINCT_RECURRING
      x-enumNames:
      - Special
      - DistinctOnce
      - DistinctRecurring
    Fields:
      title: Fields error details
      description: The names of invalid input fields
      required:
      - fields
      properties:
        fields:
          title: Fields
          description: One or more invalid fields
          type: array
          items:
            type: string
          examples:
          - - type
            - status
      type: object
    ApiErrors:
      properties:
        type:
          description: Unique identifier of the error
          type: string
          examples:
          - General
        message:
          description: Textual error description
          type: string
          examples:
          - The requested resource could not be found.
        details:
          description: Additional error details if necessary
          type:
          - object
          - 'null'
          examples:
          - null
        path:
          type:
          - string
          - 'null'
      type: object
    ResourceNotFoundError:
      title: Resource not found error
      properties:
        type:
          type: string
          enum:
          - ResourceNotFound
        message:
          type:
          - string
          - 'null'
          examples:
          - The requested resource could not be found.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: BadRequest
    ResourceConflictFoundError:
      title: Resource conflict found error
      properties:
        type:
          type: string
          enum:
          - ResourceConflictFound
        message:
          type:
          - string
          - 'null'
          examples:
          - There is already a service with this name.
        path:
          type:
          - string
          - 'null'
        details:
          $ref: '#/components/schemas/Resource'
      type: object
      x-error-category: BadRequest
    ApiNonbusinessDaysV2Errors:
      title: Api nonbusiness days v2 errors
      required:
      - error
      properties:
        error:
          title: Errors
          type: object
          anyOf:
          - $ref: '#/components/schemas/ResourceConflictFoundError'
          - $ref: '#/components/schemas/ResourceNotFoundError'
          - $ref: '#/components/schemas/InvalidDateError'
          - $ref: '#/components/schemas/InvalidCombinationError'
      type: object
    NonbusinessDayV2:
      required:
      - id
      - nonbusiness_group_id
      - type
      - name
      - half_day
      - surcharge_special
      - evaluated_date
      properties:
        id:
          type: integer
          format: int64
          examples:
          - 10
        nonbusiness_group_id:
          type: integer
          format: int64
          examples:
          - 504
        type:
          $ref: '#/components/schemas/NonbusinessDayType'
        name:
          type: string
          examples:
          - Tag der deutschen Einheit
        half_day:
          type: boolean
          examples:
          - true
        surcharge_special:
          type: boolean
          examples:
          - true
        special_id:
          type: integer
          format: int64
          examples:
          - 64
        evaluated_date:
          title: Evaluated date for the requested year
          description: 'Default: CurrentYear'
          type: string
          format: date
          examples:
          - '2021-10-03'
        day:
          title: Day of the nonbusiness day
          description: only for types DISTINCT_ONCE and DISTINCT_RECURRING
          type: integer
          format: int64
          examples:
          - 3
        month:
          title: Month of the nonbusiness day
          description: only for types DISTINCT_ONCE and DISTINCT_RECURRING
          type: integer
          format: int64
          examples:
          - 10
        year:
          title: Year of the nonbusiness day
          description: only for type DISTINCT_ONCE
          type: integer
          format: int64
          examples:
          - 2021
      type: object
    GeneralErrors:
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrors'
      type: object
    InvalidDateError:
      title: Invalid date error
      properties:
        type:
          type: string
          enum:
          - InvalidDate
        message:
          type:
          - string
          - 'null'
          examples:
          - The given value is not an actual date.
        path:
          type:
          - string
          - 'null'
        details:
          type: 'null'
      type: object
      x-error-category: BadRequest
    ResourceEnum:
      title: Resource enum
      description: 'Possible values:

        - `absences`: Absences

        - `access_groups`: AccessGroups

        - `company`: Company

        - `company_state`: CompanyState

        - `customers`: Customers

