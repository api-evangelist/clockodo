- name: User
  description: Manage co-workers
paths:
  /v2/users/{id}/access/customers-projects:
    get:
      tags:
      - User
      operationId: getUserAccessCustomersProjectsByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer_projects_access_v2'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get user access customers projects by id V2
      x-summary-source: derived
  /v2/users/{id}/access/services:
    get:
      tags:
      - User
      operationId: getUserAccessServicesByIdV2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          examples:
          - 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services_access_v2'
      deprecated: false
      summary: Get user access services by id V2
      x-summary-source: derived
  /v3/users:
    get:
      tags:
      - User
      operationId: getUsersV3
      parameters:
      - name: filter
        in: query
        required: false
        style: deepObject
        explode: true
        schema:
          properties:
            active:
              type: boolean
            fulltext:
              type: string
            teams_id:
              oneOf:
              - type: array
                items:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                maxItems: 500
              - type:
                - integer
                - 'null'
                minimum: 0
              - type: string
                format: csv-string
                x-csv-element-schema:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
          type: object
      - name: items_per_page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          maximum: 1000
          minimum: 1
          examples:
          - 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          examples:
          - 1
      - name: scope
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserScope'
      - name: sort
        in: query
        required: false
        schema:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/ApiUsersV3_SortForIndex'
          - $ref: '#/components/schemas/ApiUsersV3_SortForIndex'
          - type: string
            format: csv-string
            x-csv-element-schema:
              $ref: '#/components/schemas/ApiUsersV3_SortForIndex'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - paging
                - data
                properties:
                  paging:
                    required:
                    - items_per_page
                    - current_page
                    - count_pages
                    - count_items
                    properties:
                      items_per_page:
                        type: integer
                        format: int64
                        examples:
                        - 1000
                      current_page:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_pages:
                        type: integer
                        format: int64
                        examples:
                        - 1
                      count_items:
                        type: integer
                        format: int64
                        examples:
                        - 4
                    type: object
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserV3'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Get users V3
      x-summary-source: derived
    post:
      tags:
      - User
      operationId: createUserV3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
              - email
              - name
              - role
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 90
                name:
                  type: string
                  maxLength: 100
                role:
                  $ref: '#/components/schemas/Role'
                active:
                  type: boolean
                boss:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                number:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
                language:
                  $ref: '#/components/schemas/Language'
                teams_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                timeformat_12h:
                  description: Use 12h time format?
                  type: boolean
                timezone:
                  $ref: '#/components/schemas/ConvertibleTimezone'
                wage_type:
                  $ref: '#/components/schemas/WageType'
                weekstart_monday:
                  description: Start week on Monday?
                  type: boolean
                show_favorites:
                  type: boolean
                mail_to_user:
                  description: 'Sent mail to the new co-worker? (default: false)'
                  type: boolean
                start_date:
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                budget_notifications:
                  type: boolean
                  x-requires_module: budget_notifications
                edit_lock:
                  description: The date after the co-worker is not allowed to edit his entries anymore. Ignored if `edit_lock_period` is given as well. Can only be set by administrators or workers with elevated access `manage_users_access`.
                  type:
                  - string
                  - 'null'
                  format: date
                  examples:
                  - '2023-02-28'
                edit_lock_dyn:
                  oneOf:
                  - $ref: '#/components/schemas/EditLockDay'
                    description: Dynamic edit lock for this co-worker. Can only be set by administrators or workers with elevated access `manage_users_access`.
                  - type: 'null'
                  description: Dynamic edit lock for this co-worker. Can only be set by administrators or workers with elevated access `manage_users_access`.
                edit_lock_sync:
                  description: Can future changes to the company-wide edit lock overwrite the edit lock for this co-worker? Can only be set by administrators or workers with elevated access `manage_users_access`.
                  type: boolean
                work_time_edit_lock_days:
                  oneOf:
                  - $ref: '#/components/schemas/WorkTimeEditLockDay'
                    description: Relative work time editing lock in days for the co-worker. Can only be set by administrators or workers with elevated access `manage_users_access`.
                  - type: 'null'
                  description: Relative work time editing lock in days for the co-worker. Can only be set by administrators or workers with elevated access `manage_users_access`.
                default_holidays_count:
                  description: Uses the company's default holiday count
                  type: boolean
                default_target_hours:
                  description: Uses the company's default target hours
                  type: boolean
                work_time_regulations_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                default_work_time_regulation:
                  description: Uses the company's default work time regulation
                  type: boolean
                exempt_from_flextime:
                  description: Is exempt from flextime violation evaluation
                  type: boolean
                absence_managers_id:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  maxItems: 500
                  minItems: 0
                access_groups_ids:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  maxItems: 30
                  minItems: 0
                bill_service_id:
                  type:
                  - string
                  - 'null'
                  maxLength: 50
              type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserV3'
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                required:
                - errors
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiUsersV3Errors'
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrors'
      deprecated: false
      summary: Create user V3
      x-summary-source: derived
